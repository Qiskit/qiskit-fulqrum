name: Testing - aarch64
on:
  push:
    branches: [main]
  pull_request:
    branches: []
jobs:
  conda-test:
    name: Build on ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      max-parallel: 5
      matrix:
        include:
          - arch: aarch64
            distro: ubuntu-latest
            python-version: "3.14"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Configure Fast APT Mirror
      uses: vegardit/fast-apt-mirror.sh@v1
      with: # the following parameters are listed with their action default values and are optional
        healthchecks:  20 # Number of mirrors from the mirrors list to check for availability and up-to-dateness
        speedtests:    10 # Maximum number of healthy mirrors to test for speed
        parallel:       2 # Number of parallel speed tests
        sample-size: 1024 # Number of kilobytes to download during the speed from each mirror
        sample-time:    3 # Maximum number of seconds within the sample download from a mirror must finish
        country:       "CH" # The country code for selecting Ubuntu mirrors. If not set, defaults to http://mirrors.ubuntu.com/mirrors.txt
        exclude-current: false # If set to "true", don't include the current APT mirror in the speed tests
        configure-mirror: auto # Whether to configure the APT mirror: auto, true, or false
    - name: Set up Python
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniconda-version: "latest"
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        conda info
        sudo apt-get update
        sudo apt-get install libblas libblas-dev liblapack-dev
        pip install -U -r requirements.txt
        pip install -U -r requirements-dev.txt
    - name: Ruff lint and format
      run: |
        ruff check fulqrum
        ruff format fulqrum --check
    - name: Run tests with pytest
      run: |
        FQ_DEBUG=1 python setup.py build_ext --inplace
        pytest -p no:warnings --pyargs fulqrum/test
    - name: Run C++ tests
      run: |
        sh cpp-tests.sh
